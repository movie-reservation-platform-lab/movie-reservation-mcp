name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Compile Python sources
        run: uv run --frozen --no-sync python -m compileall src tests automation

      - name: Lint
        run: uv run --frozen --no-sync ruff check .

      - name: Check formatting
        run: uv run --frozen --no-sync ruff format --check .

  contract-tests:
    name: contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run MCP contract tests
        run: uv run --frozen --no-sync pytest tests

  automation-tests:
    name: repository automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run repository automation tests
        run: uv run --frozen --no-sync pytest automation/tests

  container-smoke:
    name: production container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag movie-reservation-mcp:smoke .

      - name: Start task-local downstream stub
        run: python3 automation/downstream_stub.py &

      - name: Start production container
        run: docker run --detach --name movie-reservation-mcp --network host movie-reservation-mcp:smoke

      - name: Verify health, MCP route, and runtime user
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8091/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs movie-reservation-mcp
              exit 1
            fi
            sleep 1
          done

          mcp_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8091/mcp)"
          test "$mcp_status" != "000"
          test "$mcp_status" != "404"
          test "$(docker exec movie-reservation-mcp id -u)" != "0"

      - name: Stop production container
        if: always()
        run: docker stop movie-reservation-mcp || true

  publish-image:
    name: publish immutable GHCR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'movie-reservation-platform-lab/movie-reservation-mcp'
    needs:
      - quality
      - contract-tests
      - automation-tests
      - container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Set up Node.js for shared evidence tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Prepare canonical candidate
        id: candidate
        uses: movie-reservation-platform-lab/movie-platform-actions/actions/prepare-container-candidate@9b7b5a601367a45356687a0e1bf1d1638d62aca9 # shared evidence v1alpha2
        with:
          component: reservation-mcp

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish single-platform image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.candidate.outputs.image_ref }}:${{ steps.candidate.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.candidate.outputs.tag }}

      - name: Attest and publish security evidence
        uses: movie-reservation-platform-lab/movie-platform-actions/actions/container-evidence@9b7b5a601367a45356687a0e1bf1d1638d62aca9 # shared evidence v1alpha2
        with:
          component: reservation-mcp
          digest: ${{ steps.build.outputs.digest }}
          github-token: ${{ github.token }}
